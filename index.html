<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alvaro Puertolas — La batalla por mi atención</title>
  <!-- El nombre tiene que coincidir con el del archivo: style.css -->
  <link rel="stylesheet" href="style.css?v=20261123">
  <noscript>
    <style>
      body.is-intro { overflow: auto; }
      body.is-intro .panel--cover .panel-inner { opacity: 1; }
      .cursor { display: none; }
    </style>
  </noscript>
</head>
<body class="is-intro">

  <canvas id="grain" aria-hidden="true"></canvas>
  <div class="cursor" aria-hidden="true"></div>
  <div class="film" aria-hidden="true"></div>

  <button class="sound" type="button" aria-pressed="false" aria-label="Activar sonido">
    <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <main>

    <section class="panel panel--cover">
      <div class="panel-inner">
        <p class="kicker">Algoritmo vs Voluntad</p>
        <h1><span>alvaro</span><span>puertolas</span></h1>
      </div>
    </section>

    <section class="panel panel--question">
      <div class="panel-inner">
        <p class="question">¿Consumo lo que <em>yo decido</em> buscar o lo que la página de inicio <em>me sirve en bandeja</em>?</p>
      </div>
    </section>

    <section class="panel panel--end" aria-label="Los datos de YouTube, a continuación">
      <button class="play-cta" type="button" aria-label="Ver los datos, en construcción">
        <span class="play-cta__hint">click</span>
      </button>
    </section>

  </main>

  <div class="room" id="room" hidden>
    <div class="room__bar">
      <button class="room__back" type="button">← volver</button>
      <span class="room__status">datos · en construcción</span>
    </div>
    <nav class="room__years" id="roomYears" aria-label="Años"></nav>
    <p class="room__hint room__hint--mouse">mueve el ratón · scroll para avanzar</p>
    <p class="room__hint room__hint--touch">arrastra para mirar y avanzar</p>
  </div>

  <script src="script.js?v=20261123"></script>
</body>
</html>
